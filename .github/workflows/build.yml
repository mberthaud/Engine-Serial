name: Build-libraries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            package: csharp-windows
            os: windows-latest
            cmake_args: ""
            artifact: Build/Release/MySerial.dll
          - name: Linux
            package: csharp-linux
            os: ubuntu-latest
            cmake_args: ""
            artifact: Build/libMySerial.so
          - name: macOS
            package: csharp-macos
            os: macos-26
            #I dont think we need x86 since silicon macs are ARM but all runners I see included so 
            #I did too
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            artifact: Build/libMySerial.dylib

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build Build --config Release --parallel

      - name: Package
        run: |
          cmake -E make_directory package
          cmake -E copy ${{ matrix.artifact }} bindings/csbindings/Scanner.cs bindings/csbindings/ScannerBindings.cs package

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: package
          if-no-files-found: error

  gdextension:
    name: GDExtension ${{ matrix.name }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [Windows, Linux, macOS]
        target: [template_debug, template_release]
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S bindings/godot -B build-gd -DCMAKE_BUILD_TYPE=Release -DGODOTCPP_TARGET=${{ matrix.target }}

      - name: Build
        run: cmake --build build-gd --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: gdextension-${{ matrix.name }}-${{ matrix.target }}
          path: |
            bindings/godot/addons/serial_scanner/bin/*.dll
            bindings/godot/addons/serial_scanner/bin/*.so
            bindings/godot/addons/serial_scanner/bin/*.dylib
          if-no-files-found: error

  gdextension-distributions:
    name: GDExtension addon
    needs: gdextension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: gdextension-*
          path: bindings/godot/addons/serial_scanner/bin
          merge-multiple: true

      - uses: actions/upload-artifact@v4
        with:
          name: serial_scanner-addon
          path: bindings/godot/addons
          if-no-files-found: error
